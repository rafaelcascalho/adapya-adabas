[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adapya-adabas"
version = "1.4.0"
description = "adapya-adabas - Software AG Adabas Database API for Python"
readme = "README.rst"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "mmueller", email = "mm@softwareag.com" },
]
maintainers = [
    { name = "Rafael Cascalho", email = "cascalhoeng@gmail.com" },
]
keywords = ["softwareag", "adabas", "database"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX :: Other",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development",
]
dependencies = [
    "adapya-base>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff>=0.5",
    "mypy>=1.10",
    "build",
]

[tool.uv]
package = true
default-groups = ["dev"]

[project.urls]
Homepage = "https://github.com/rafaelcascalho/adapya-adabas"
Upstream = "https://github.com/SoftwareAG/adapya-adabas"
Documentation = "https://softwareag.github.io/adapya-adabas/index.html"

[tool.setuptools]
zip-safe = false
script-files = [
    "adapya/adabas/scripts/dblist.py",
    "adapya/adabas/scripts/mproc.py",
    "adapya/adabas/scripts/ticker.py",
    "adapya/adabas/scripts/search.py",
    "adapya/adabas/scripts/asmfreader.py",
]

[tool.setuptools.packages.find]
include = ["adapya*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",
    "E731",
    "E741",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:adapya.base.*",
]

[tool.mypy]
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["adapya"]
# This codebase is heavily ctypes-driven; full strict typing is out of scope.
# These flags exist so CI can run mypy without hard-failing while we improve gradually.
check_untyped_defs = false
disable_error_code = ["import-untyped"]
